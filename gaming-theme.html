<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Delius+Unicase:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/public/src/styles/gaming-screen.scss">

    <title>Gaming Theme</title>

</head>

<body>

    <section class="gaming__main-container">

        <header class="gaming__header">

            <div class="gaming__header-left-part">

                <div class="gaming__blue-orange-box">

                    <!-- PLAYER 1 - ORANGE -->

                    <div class="
                        gaming__player-score
                        gaming__player-score--orange
                    ">

                        <img class="
                                gaming__label
                                gaming__label--orange
                            " src="/public/assets/images/label (2).png" alt="Orange player">

                        <span class="gaming__player-name">
                            orange
                        </span>

                        <span id="player1Score">
                            0
                        </span>

                    </div>


                    <!-- PLAYER 2 - BLUE -->

                    <div class="
                        gaming__player-score
                        gaming__player-score--blue
                    ">

                        <img class="
                                gaming__label
                                gaming__label--blue
                            " src="/public/assets/images/label.png" alt="Blue player">

                        <span class="gaming__player-name">
                            Blue
                        </span>

                        <span id="player2Score">
                            0
                        </span>

                    </div>

                </div>


                <div class="gaming__header-current-player">

                    <img src="/public/assets/images/current_player_logo.png" alt="Current player">

                </div>

            </div>


            <div class="gaming__header-right-part-exit-game">

                <img src="/public/assets/images/exit_button.png" alt="Exit game">

            </div>

        </header>


        <!-- MEMORY -->

        <div class="memory">

            <div class="memory__card-container"></div>

        </div>

    </section>


    <!-- WINNER POPUP -->

    <div class="winner-popup-overlay" id="winnerPopup">

        <div class="winner-popup">

            <img class="winner-popup__confetti" src="/public/assets/images/Confetti.png" alt="Confetti">


            <!-- BLUE WINNER -->

            <div class="winner-popup__container" id="blueWinner">

                <img class="winner-popup__blue-player" src="/public/assets/images/winner_blue_player.png"
                    alt="Blue player winner">

                <div class="
                        winner-popup__score
                        winner-popup__score--blue
                    ">

                    <span id="blueWinnerScore">
                        0
                    </span>

                </div>

            </div>


            <!-- ORANGE WINNER -->

            <div class="
                    winner-popup__container
                    winner-popup__container--orange
                " id="orangeWinner">

                <img class="
                        winner-popup__text--orange
                    " src="/public/assets/images/winner_text_orange.png" alt="Orange winner">

                <img class="
                        winner-popup__player--orange
                    " src="/public/assets/images/winner_player_orange.png" alt="Orange player winner">

                <div class="
                        winner-popup__score
                        winner-popup__score--orange
                    ">

                    <span id="orangeWinnerScore">
                        0
                    </span>

                </div>

            </div>

        </div>

    </div>


    <!-- EXIT POPUP -->

    <div class="exit-popup-overlay" id="exitPopup">

        <div class="exit-popup">

            <img class="exit-popup__image" src="/public/assets/images/popup_exit_button.png" alt="Exit game popup">


            <div class="exit-popup__back-area" id="exitGame">
            </div>


            <div class="exit-popup__exit-area" id="backToGame">
            </div>

        </div>

    </div>


    <script type="module" src="/public/src/gaming.ts"></script>

</body>

</html>
