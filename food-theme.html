    <!-- EXIT POPUP -->
    <div class="exit-popup-overlay" id="exitPopup">

        <div class="exit-popup">

            <img class="exit-popup__image" src="/public/assets/images/popup_exit_button_food.png" alt="Exit game popup">

            <div class="exit-popup__back-area" id="backToGame">
            </div>

            <div class="exit-popup__exit-area" id="exitGame">
            </div>

        </div>

    </div>

    <script>

        const cards = document.querySelectorAll(".memory__card");

        const exitButton = document.querySelector(
            ".gaming__header-right-part-exit-game"
        );

        const exitPopup = document.querySelector("#exitPopup");

        const popup = document.querySelector(".exit-popup");

        const backToGame = document.querySelector("#backToGame");

        const exitGame = document.querySelector("#exitGame");

        let firstCard = null;
        let secondCard = null;
        let lockBoard = false;

        /**
         * Shuffles the memory cards.
         */
        function shuffleCards() {
            const container =
                document.querySelector(".memory__card-container");

            const cardArray = Array.from(cards);

            cardArray.sort(() => Math.random() - 0.5);

            cardArray.forEach((card) => {
                container.appendChild(card);
            });
        }

        /**
         * Flips the selected card.
         *
         * @param {HTMLElement} card selected card
         */
        function flipCard(card) {

            if (lockBoard || card === firstCard) {
                return;
            }

            card.classList.add("is-flipped");

            if (!firstCard) {
                firstCard = card;
                return;
            }

            secondCard = card;

            checkMatch();
        }

        /**
         * Checks whether the selected cards match.
         */
        function checkMatch() {

            const isMatch =
                firstCard.dataset.card === secondCard.dataset.card;

            if (isMatch) {
                resetBoard();
                return;
            }

            unflipCards();
        }

        /**
         * Turns unmatched cards back over.
         */
        function unflipCards() {

            lockBoard = true;

            setTimeout(() => {

                firstCard.classList.remove("is-flipped");
                secondCard.classList.remove("is-flipped");

                resetBoard();

            }, 1000);
        }

        /**
         * Resets the selected cards.
         */
        function resetBoard() {

            firstCard = null;
            secondCard = null;
            lockBoard = false;
        }

        /**
         * Opens the exit popup.
         */
        function openExitPopup() {

            exitPopup.classList.remove("is-closing");
            exitPopup.classList.add("is-visible");
        }

        /**
         * Closes the exit popup with slide-up animation.
         */
        function closeExitPopup() {

            exitPopup.classList.add("is-closing");

            setTimeout(() => {

                exitPopup.classList.remove("is-visible");
                exitPopup.classList.remove("is-closing");

            }, 450);
        }

        /**
         * Returns to the settings page.
         */
        function leaveGame() {

            window.location.href = "settings.html";
        }

        /**
         * Initializes the game.
         */
        function initGame() {

            shuffleCards();

            cards.forEach((card) => {

                card.addEventListener(
                    "click",
                    () => flipCard(card)
                );

            });

            exitButton.addEventListener(
                "click",
                openExitPopup
            );

            backToGame.addEventListener(
                "click",
                closeExitPopup
            );

            exitGame.addEventListener(
                "click",
                leaveGame
            );

            exitPopup.addEventListener(
                "click",
                (event) => {

                    if (!popup.contains(event.target)) {
                        closeExitPopup();
                    }

                }
            );
        }

        initGame();

    </script>
