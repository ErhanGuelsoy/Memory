<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/public/src/styles/food-theme.scss">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Delius+Unicase:wght@400;700&display=swap" rel="stylesheet">

    <title>Food Theme</title>

</head>

<body>

    <section class="gaming__main-container">

        <header class="gaming__header">

            <div class="gaming__header-left-part">

                <div class="gaming__blue-orange-box">

                    <!-- PLAYER 1 - ORANGE -->

                    <div class="
                        gaming__player-score
                        gaming__player-score--orange
                    ">

                        <img class="gaming__chess" src="/public/assets/images/chess_orange_left.png" alt="Orange chess">

                        <span id="player1Score">
                            0
                        </span>

                    </div>


                    <!-- PLAYER 2 - BLUE -->

                    <div class="
                        gaming__player-score
                        gaming__player-score--blue
                    ">

                        <img class="gaming__chess" src="/public/assets/images/chess_blue_right.png" alt="Blue chess">

                        <span id="player2Score">
                            0
                        </span>

                    </div>

                </div>


                <div class="gaming__header-current-player">

                    <img src="/public/assets/images/Frame_current_player.png" alt="Current player">

                </div>

            </div>


            <div class="gaming__header-right-part-exit-game">

                <img src="/public/assets/images/button_exit.png" alt="Exit game">

            </div>

        </header>


        <!-- MEMORY CARDS -->

        <main class="memory">

            <div class="memory__card-container" data-card-count="16">
            </div>

        </main>

    </section>


    <!-- WINNER POPUP -->

    <div class="winner-popup-overlay" id="winnerPopup">

        <div class="winner-popup">


            <!-- BLUE WINNER -->

            <div class="winner-popup__container" id="blueWinner">

                <img class="winner-popup__text" src="/public/assets/images/winner_blue_chess.png"
                    alt="Blue player winner">


                <div class="
                    winner-popup__score
                    winner-popup__score--blue
                ">

                    <img class="winner-popup__chess" src="/public/assets/images/winner_chess_blue_orange_layout.png"
                        alt="Blue winner chess">

                    <span id="blueWinnerScore">
                        0
                    </span>

                </div>


                <!-- BACK TO SETTINGS -->

                <img class="winner-popup__back-home" id="blueBackHome" src="/public/assets/images/back_home_button.png"
                    alt="Back to settings">

            </div>


            <!-- ORANGE WINNER -->

            <div class="winner-popup__container" id="orangeWinner">

                <img class="winner-popup__text" src="/public/assets/images/winner_text_orange.png"
                    alt="Orange player winner">


                <div class="
                    winner-popup__score
                    winner-popup__score--orange
                ">

                    <img class="winner-popup__chess" src="/public/assets/images/winner_chess_orange.png"
                        alt="Orange winner chess">

                    <span id="orangeWinnerScore">
                        0
                    </span>

                </div>


                <!-- BACK TO SETTINGS -->

                <img class="winner-popup__back-home" id="orangeBackHome"
                    src="/public/assets/images/back_home_button.png" alt="Back to settings">

            </div>

        </div>

    </div>


    <!-- EXIT POPUP -->

    <div class="exit-popup-overlay" id="exitPopup">

        <div class="exit-popup">

            <img class="exit-popup__image" src="/public/assets/images/popup_exit_button_food.png" alt="Exit game popup">


            <div class="exit-popup__back-area" id="backToGame">
            </div>


            <div class="exit-popup__exit-area" id="exitGame">
            </div>

        </div>

    </div>


    <!-- FOOD THEME TYPESCRIPT -->

    <script type="module" src="/public/src/food-theme.ts"></script>

</body>

</html>
