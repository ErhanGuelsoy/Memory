<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Delius+Unicase:wght@400;700&family=Klee+One:wght@400;600&family=Red+Rose:wght@400;700&display=swap"
        rel="stylesheet">

    <link rel="icon" type="image/png" href="./assets/images/chess_favicon.png">

    <title>Food Theme</title>
</head>

<body>

    <section class="gaming__main-container">

        <header class="gaming__header">

            <div class="gaming__header-left-part">

                <div class="gaming__blue-orange-box">

                    <div class="gaming__player-score gaming__player-score--orange" data-player="orange">

                        <img
                            class="gaming__chess gaming__chess--orange"
                            src="./assets/images/chess_pawn_orange.svg"
                            alt="Orange chess">

                        <span id="player1Score">0</span>

                    </div>

                    <div class="gaming__player-score gaming__player-score--blue" data-player="blue">

                        <img
                            class="gaming__chess gaming__chess--blue"
                            src="./assets/images/chess_pawn_blue.svg"
                            alt="Blue chess">

                        <span id="player2Score">0</span>

                    </div>

                </div>

            </div>

            <div class="gaming__header-current-player">

                <span class="gaming__current-player-text">
                    Current Player:
                </span>

                <img
                    id="currentPlayerLogo"
                    class="gaming__current-player-logo"
                    src="./assets/images/chess_current_player_blue.svg"
                    alt="Current player: Blue">

            </div>

            <div class="gaming__header-right-part-exit-game">

                <span class="gaming__exit-icon" aria-hidden="true">

                    <svg
                        viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg">

                        <path
                            d="M9 5H5C4.45 5 4 5.45 4 6V18C4 18.55 4.45 19 5 19H9"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.5"
                            stroke-linecap="round" />

                        <path
                            d="M12 12H20"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.5"
                            stroke-linecap="round" />

                        <path
                            d="M17 8L21 12L17 16"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.5"
                            stroke-linecap="round"
                            stroke-linejoin="round" />

                    </svg>

                </span>

                <span class="gaming__exit-text">
                    Exit game
                </span>

            </div>

        </header>

        <main class="memory">

            <div
                class="memory__card-container"
                data-card-count="16">
            </div>

        </main>

    </section>

    <div
        class="game-over-food-popup-overlay"
        id="gameOverPopup">

        <div class="game-over-food-popup">

            <div class="game-over-food-popup__title">
                GAME OVER
            </div>

            <div class="game-over-food-popup__score-container">

                <div class="game-over-food-popup__final-score">
                    FINAL SCORE
                </div>

                <div class="gaming__blue-orange-box game-over-food-popup__score-box">

                    <div
                        class="gaming__player-score gaming__player-score--orange"
                        data-player="orange">

                        <img
                            class="gaming__chess gaming__chess--orange"
                            src="./assets/images/chess_pawn_orange.svg"
                            alt="Orange chess">

                        <span id="gameOverOrangeScore">
                            0
                        </span>

                    </div>

                    <div
                        class="gaming__player-score gaming__player-score--blue"
                        data-player="blue">

                        <img
                            class="gaming__chess gaming__chess--blue"
                            src="./assets/images/chess_pawn_blue.svg"
                            alt="Blue chess">

                        <span id="gameOverBlueScore">
                            0
                        </span>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <div
        class="winner-popup-overlay"
        id="winnerPopup">

        <div class="winner-popup">

            <div
                class="winner-popup__container"
                id="blueWinner">

                <div class="winner-popup__winner-title">

                    <span class="winner-popup__winner-title-top">
                        The winner is
                    </span>

                    <span class="winner-popup__winner-title-bottom">
                        Blue Player
                    </span>

                </div>

                <div class="winner-popup__score winner-popup__score--blue">

                    <img
                        class="winner-popup__chess"
                        src="./assets/images/winner_chess_blue_orange_layout.png"
                        alt="Blue winner chess">

                    <span id="blueWinnerScore">
                        0
                    </span>

                </div>

                <button
                    class="winner-popup__back-home"
                    id="blueBackHome"
                    type="button">

                    <span>
                        HOME
                    </span>

                </button>

            </div>

            <div
                class="winner-popup__container"
                id="orangeWinner">

                <div class="winner-popup__winner-title">

                    <span class="winner-popup__winner-title-top">
                        The winner is
                    </span>

                    <span class="winner-popup__winner-title-bottom">
                        Orange Player
                    </span>

                </div>

                <div class="winner-popup__score winner-popup__score--orange">

                    <img
                        class="winner-popup__chess"
                        src="./assets/images/winner_chess_orange.png"
                        alt="Orange winner chess">

                    <span id="orangeWinnerScore">
                        0
                    </span>

                </div>

                <button
                    class="winner-popup__back-home"
                    id="orangeBackHome"
                    type="button">

                    <span>
                        HOME
                    </span>

                </button>

            </div>

            <div
                class="winner-popup__container winner-popup__container--draw"
                id="drawWinner">

                <div class="winner-popup__draw-title">

                    <span class="winner-popup__draw-title-top">
                        It's a
                    </span>

                    <span class="winner-popup__draw-title-bottom">
                        DRAW
                    </span>

                </div>

                <img
                    class="winner-popup__draw-frame"
                    src="./assets/images/Draw_frame.png"
                    alt="Draw frame">

                <button
                    class="winner-popup__back-home"
                    id="drawBackHome"
                    type="button">

                    <span>
                        HOME
                    </span>

                </button>

            </div>

        </div>

    </div>

    <div
        class="exit-popup-overlay"
        id="exitPopup">

        <div class="exit-popup">

            <div class="exit-popup__content">

                <div class="exit-popup__message">
                    Are you sure you want to quit the game?
                </div>

                <div class="exit-popup__buttons">

                    <button
                        class="exit-popup__button exit-popup__button--back"
                        id="backToGame"
                        type="button">

                        No, back to game

                    </button>

                    <button
                        class="exit-popup__button exit-popup__button--exit"
                        id="exitGame"
                        type="button">

                        Exit game

                    </button>

                </div>

            </div>

        </div>

    </div>

    <script type="module" src="/src/food-theme.ts"></script>

</body>

</html>
