<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Delius+Unicase:wght@400;700&family=Red+Rose:wght@400;700&display=swap"
        rel="stylesheet">

    <link rel="icon" type="image/png" href="./assets/images/chess_favicon.png">

    <title>Food Theme</title>
</head>

<body>

    <section class="gaming__main-container">

        <header class="gaming__header">

            <div class="gaming__header-left-part">

                <div class="gaming__blue-orange-box">

                    <div class="gaming__player-score gaming__player-score--orange" data-player="orange">
                        <img class="gaming__chess" src="./assets/images/chess_orange_left.png" alt="Orange chess">

                        <span id="player1Score">
                            0
                        </span>
                    </div>

                    <div class="gaming__player-score gaming__player-score--blue" data-player="blue">
                        <img class="gaming__chess" src="./assets/images/chess_blue_right.png" alt="Blue chess">

                        <span id="player2Score">
                            0
                        </span>
                    </div>

                </div>

            </div>

            <div class="gaming__header-current-player">

                <span class="gaming__current-player-text">
                    Current Player
                </span>

                <img id="currentPlayerLogo" class="gaming__current-player-logo"
                    src="./assets/images/chess current player blue.png" alt="Current player: Blue">

            </div>

            <div class="gaming__header-right-part-exit-game">

                <img src="./assets/images/button_exit.png" alt="Exit game">

            </div>

        </header>

        <main class="memory">

            <div class="memory__card-container" data-card-count="16"></div>

        </main>

    </section>

    <div class="game-over-food-popup-overlay" id="gameOverPopup">

        <div class="game-over-food-popup">

            <img class="game-over-food-popup__title" src="./assets/images/game_over_food.png" alt="Game Over">

            <div class="game-over-food-popup__score-container">

                <img class="game-over-food-popup__final-score" src="./assets/images/final_score_food.png"
                    alt="Final Score">

                <div class="gaming__blue-orange-box game-over-food-popup__score-box">

                    <div class="gaming__player-score gaming__player-score--orange" data-player="orange">
                        <img class="gaming__chess" src="./assets/images/chess_orange_left.png" alt="Orange chess">

                        <span id="gameOverOrangeScore">
                            0
                        </span>
                    </div>

                    <div class="gaming__player-score gaming__player-score--blue" data-player="blue">
                        <img class="gaming__chess" src="./assets/images/chess_blue_right.png" alt="Blue chess">

                        <span id="gameOverBlueScore">
                            0
                        </span>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <div class="winner-popup-overlay" id="winnerPopup">

        <div class="winner-popup">

            <div class="winner-popup__container" id="blueWinner">

                <img class="winner-popup__text" src="./assets/images/winner_blue_chess.png" alt="Blue player winner">

                <div class="winner-popup__score winner-popup__score--blue">

                    <img class="winner-popup__chess" src="./assets/images/winner_chess_blue_orange_layout.png"
                        alt="Blue winner chess">

                    <span id="blueWinnerScore">
                        0
                    </span>

                </div>

                <img class="winner-popup__back-home" id="blueBackHome" src="./assets/images/back_home_button.png"
                    alt="Back to settings">

            </div>

            <div class="winner-popup__container" id="orangeWinner">

                <img class="winner-popup__text" src="./assets/images/winner_text_orange.png" alt="Orange player winner">

                <div class="winner-popup__score winner-popup__score--orange">

                    <img class="winner-popup__chess" src="./assets/images/winner_chess_orange.png"
                        alt="Orange winner chess">

                    <span id="orangeWinnerScore">
                        0
                    </span>

                </div>

                <img class="winner-popup__back-home" id="orangeBackHome" src="./assets/images/back_home_button.png"
                    alt="Back to settings">

            </div>

            <div class="winner-popup__container" id="drawWinner">

                <img class="winner-popup__draw-start-text" src="./assets/images/draw_start_text.png" alt="Draw start">

                <img class="winner-popup__draw-text" src="./assets/images/Draw_text.png" alt="Draw">

                <img class="winner-popup__draw-frame" src="./assets/images/Draw_frame.png" alt="Draw frame">

                <img class="winner-popup__back-home" id="drawBackHome" src="./assets/images/back_home_button.png"
                    alt="Back to settings">

            </div>

        </div>

    </div>

    <div class="exit-popup-overlay" id="exitPopup">

        <div class="exit-popup">

            <img class="exit-popup__image" src="./assets/images/popup_exit_button_food.png" alt="Exit game popup">

            <div class="exit-popup__back-area" id="backToGame"></div>

            <div class="exit-popup__exit-area" id="exitGame"></div>

        </div>

    </div>

    <script type="module" src="/src/food-theme.ts"></script>

</body>

</html>
