<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
</head>
<body>

    <section>

        <div class="settings__mainScreen">
            <div class="settings__text">
                <h1 class="settings__text">Settings</h1>
                <img src="/public/assets/images/Line 4.png" alt="yellow-arrow-line">
            </div>
        </div>


        <div class="option__bar-container">
            <div class="option__game-themes">
                <div class="option__game-text">
                    <img src="/public/assets/images/palette.png" alt="palette">
                    <h2>Games Themes</h2>
                </div>

                <div class="option-themes__bar">
                    <div class="option-themes__code-vibe">
                        <img src="/public/assets/images/fiber_manual_record.png" alt="palette">
                        <h2>Code Vibes Themes</h2>

                    </div>

                    <div class="option-themes__gaming">
                        <img src="/public/assets/images/fiber_manual_record.png" alt="palette">
                        <h2>Gaming Theme</h2>

                    </div>

                    <div class="option-themes__DA-projects">
                        <img src="/public/assets/images/fiber_manual_record.png" alt="palette">
                        <h2>DA Projects Themes</h2>
                    </div>

                    <div class="option-themes__foods">
                        <img src="/public/assets/images/fiber_manual_record.png" alt="palette">
                        <h2>Foods Themes</h2>
                    </div>

                    <div class="game__component-container">
                        <img src="/public/assets/images/Frame 629.png" alt="frame"> 
            </div>




            <div class="option-player__choose-player Board-size">
                <img src="/public/assets/images/chess_pawn.png" alt="chess image">
                <div class="option__text">Choose Player</div>
                <div class="option-themes__code-vibe">
                    <img src="/public/assets/images/fiber_manual_record.png" alt="palette">
                    <h2>Blue</h2>
            </div>


            
            <div class="option-themes__code-vibe">
                <img src="/public/assets/images/fiber_manual_record.png" alt="palette">
                <h2>Orange</h2>
        </div>



        <div class="option-board-size__container">
            <h2>Board Size</h2>
        
            <img src="/public/assets/images/style.png" alt="image-style">
            <div class="option__text-cards">
                <img src="/public/assets/images/fiber_manual_record.png" alt="16 Cards">
                <h2>16 Cards</h2>
            </div>
        
            <div class="option__text-cards">
                <img src="/public/assets/images/fiber_manual_record.png" alt="24 Cards">
                <h2>24 Cards</h2>
            </div>
        
            <div class="option__text-cards">
                <img src="/public/assets/images/fiber_manual_record.png" alt="36 Cards">
                <h2>36 Cards</h2>
            </div>


            <div class="selectionBoard__bar">
                <img src="/public/assets/images/Theme.png" alt="game-theme">
                <img src="/public/assets/images/Line 6.png" alt="yellow-line">
        
                <img src="/public/assets/images/Player.png" alt="player-text">
                <img src="/public/assets/images/Line 6.png" alt="yellow-line">
            
                <img src="/public/assets/images/Board size.png" alt="board-size-text">
            
                <div class="selectionBoard__start-button">
                    <button>
                        <img src="/public/assets/images/smart_display.png" alt="start-icon">
                        <span>Start</span>
                    </button>
                </div>
            </div>
    
    </section>

    <script type="module" src="/public/src/styles/settings-page.scss"></script>
    
</body>
</html>
