<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings</title>
</head>

<body>

    <section>

        <div class="settings__mainScreen">

            <div class="settings__text">

                <h1>Settings</h1>

                <img src="public/assets/images/Line 4.png" alt="yellow-arrow-line">

            </div>

        </div>

        <div class="option__bar-container">

            <!-- GAME THEMES -->

            <div class="option__game-themes">

                <div class="option__game-text">

                    <img src="public/assets/images/palette.png" alt="palette">

                    <h2>Games Themes</h2>

                </div>

                <div class="option-themes__bar">

                    <div class="option-themes__code-vibe" data-theme="code-vibes">

                        <img src="public/assets/images/fiber_manual_record.png" alt="theme selection">

                        <h2>Code Vibes Themes</h2>

                    </div>

                    <div class="option-themes__foods" data-theme="foods">

                        <img src="public/assets/images/fiber_manual_record.png" alt="theme selection">

                        <h2>Foods Themes</h2>

                    </div>

                </div>

            </div>

            <!-- GAME PREVIEW -->

            <div class="game__component-container">

                <img src="public/assets/images/Frame 629.png" alt="Code Vibes game preview">

            </div>

            <!-- CHOOSE PLAYER -->

            <div class="option-player__choose-player">

                <img src="public/assets/images/chess_pawn.png" alt="chess pawn">

                <div class="option__text">
                    Choose Player
                </div>

                <div class="option-themes__code-vibe" data-player="blue">

                    <img src="public/assets/images/fiber_manual_record.png" alt="blue player">

                    <h2>Blue</h2>

                </div>

                <div class="option-themes__code-vibe" data-player="orange">

                    <img src="public/assets/images/fiber_manual_record.png" alt="orange player">

                    <h2>Orange</h2>

                </div>

            </div>

            <!-- BOARD SIZE -->

            <div class="option-board-size__container">

                <h2>Board Size</h2>

                <img src="public/assets/images/style.png" alt="board size">

                <div class="option__text-cards" data-cards="16">

                    <img src="public/assets/images/fiber_manual_record.png" alt="16 Cards">

                    <h2>16 Cards</h2>

                </div>

                <div class="option__text-cards" data-cards="24">

                    <img src="public/assets/images/fiber_manual_record.png" alt="24 Cards">

                    <h2>24 Cards</h2>

                </div>

                <div class="option__text-cards" data-cards="36">

                    <img src="public/assets/images/fiber_manual_record.png" alt="36 Cards">

                    <h2>36 Cards</h2>

                </div>

            </div>

            <!-- SELECTION BAR -->

            <div class="selectionBoard__bar">

                <img src="public/assets/images/Theme.png" alt="game theme">

                <img src="public/assets/images/Line 6.png" alt="yellow line">

                <img src="public/assets/images/Player.png" alt="player">

                <img src="public/assets/images/Line 6.png" alt="yellow line">

                <img src="public/assets/images/Board size.png" alt="board size">

                <div class="selectionBoard__start-button">

                    <button id="start-button" type="button">

                        <img src="public/assets/images/smart_display.png" alt="start icon">

                        <span>Start</span>

                    </button>

                </div>

            </div>

        </div>

    </section>

    <script type="module" src="/src/settings.ts">
    </script>

</body>

</html>
