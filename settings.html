<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
</head>
<body>

                <div class="option-themes__bar">

                    <div class="option-themes__gaming">

                    <div class="option-themes__DA-projects">

                    </div>

                    <div class="option-themes__foods">
                        <img src="/public/assets/images/fiber_manual_record.png" alt="palette">

    <script type="module" src="/public/src/styles/settings-page.scss"></script>
