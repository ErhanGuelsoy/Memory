<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="icon" type="image/png" href="/assets/images/chess_favicon.png">
</head>

<body>
    <section>
        <div class="settings__mainScreen">
            <div class="settings__text">
                <h1>Settings</h1>
                <img src="/assets/images/Line 4.png" alt="yellow-arrow-line">
            </div>
        </div>

        <div class="option__bar-container">
            <div class="option__game-themes">
                <div class="option__game-text">
                    <img src="/assets/images/palette.svg" alt="palette">
                    <h2>Games Themes</h2>
                </div>

                <div class="option-themes__bar">
                    <div class="option-themes__code-vibe" data-theme="code-vibes">
                        <span class="selection-circle">
                            <img class="selection-circle__base" src="/assets/images/circle.svg" alt="">
                            <img class="selection-circle__point" src="/assets/images/frame_577.svg" alt="">
                        </span>
                        <h2>Code Vibes Themes</h2>
                    </div>

                    <div class="option-themes__foods" data-theme="foods">
                        <span class="selection-circle">
                            <img class="selection-circle__base" src="/assets/images/circle.svg" alt="">
                            <img class="selection-circle__point" src="/assets/images/frame_577.svg" alt="">
                        </span>
                        <h2>Foods Themes</h2>
                    </div>
                </div>
            </div>

            <div class="game__component-container">
                <img src="/assets/images/theme_visual.svg" alt="Code Vibes game preview">
            </div>

            <div class="option-player__choose-player">
                <img src="/assets/images/chess_pawn.svg" alt="chess pawn">

                <div class="option__text">
                    Choose Player
                </div>

                <div class="option-themes__code-vibe" data-player="blue">
                    <span class="selection-circle">
                        <img class="selection-circle__base" src="/assets/images/circle.svg" alt="">
                        <img class="selection-circle__point" src="/assets/images/frame_577.svg" alt="">
                    </span>
                    <h2>Blue</h2>
                </div>

                <div class="option-themes__code-vibe" data-player="orange">
                    <span class="selection-circle">
                        <img class="selection-circle__base" src="/assets/images/circle.svg" alt="">
                        <img class="selection-circle__point" src="/assets/images/frame_577.svg" alt="">
                    </span>
                    <h2>Orange</h2>
                </div>
            </div>

            <div class="option-board-size__container">
                <h2>Board Size</h2>
                <img src="/assets/images/style.svg" alt="board size">

                <div class="option__text-cards" data-cards="16">
                    <span class="selection-circle">
                        <img class="selection-circle__base" src="/assets/images/circle.svg" alt="">
                        <img class="selection-circle__point" src="/assets/images/frame_577.svg" alt="">
                    </span>
                    <h2>16 Cards</h2>
                </div>

                <div class="option__text-cards" data-cards="24">
                    <span class="selection-circle">
                        <img class="selection-circle__base" src="/assets/images/circle.svg" alt="">
                        <img class="selection-circle__point" src="/assets/images/frame_577.svg" alt="">
                    </span>
                    <h2>24 Cards</h2>
                </div>

                <div class="option__text-cards" data-cards="36">
                    <span class="selection-circle">
                        <img class="selection-circle__base" src="/assets/images/circle.svg" alt="">
                        <img class="selection-circle__point" src="/assets/images/frame_577.svg" alt="">
                    </span>
                    <h2>36 Cards</h2>
                </div>
            </div>

            <div class="selectionBoard__bar">
                <div class="selectionBoard__option">
                    <span id="selected-theme">Game Theme</span>
                </div>

                <img class="selectionBoard__arrow" src="/assets/images/Line 6.png" alt="yellow arrow">

                <div class="selectionBoard__option">
                    <span id="selected-player">Player</span>
                </div>

                <img class="selectionBoard__arrow" src="/assets/images/Line 6.png" alt="yellow arrow">

                <div class="selectionBoard__option">
                    <span id="selected-cards">Board Size</span>
                </div>

                <div class="selectionBoard__start-button">
                    <button id="start-button" type="button">
                        <img src="/assets/images/smart_display.png" alt="start icon">
                        <span>Start</span>
                    </button>
                </div>
            </div>
        </div>
    </section>

    <script type="module" src="/src/settings.ts"></script>

</body>

</html>
